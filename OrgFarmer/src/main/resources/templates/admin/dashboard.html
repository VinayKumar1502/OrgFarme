<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - OrgFarmer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f4;
        }
        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            position: fixed;
            height: 100%;
            padding: 20px;
        }
        .sidebar h2 {
            margin-bottom: 30px;
            text-align: center;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
        }
        .stat-label {
            color: #7f8c8d;
            margin-top: 10px;
        }
        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #34495e;
            color: white;
        }
        .logout-btn {
            background: #e74c3c;
            padding: 8px 20px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🌱 OrgFarmer<br><small style="font-size: 12px;">Admin Panel</small></h2>
        <a href="/admin/dashboard">📊 Dashboard</a>
        <a href="/admin/users">👥 Users</a>
        <a href="/admin/products">📦 Products</a>
        <a href="/admin/reviews">⭐ Reviews</a>
        <a href="/admin/messages">✉️ Messages</a>
    </div>
    
    <div class="content">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <a href="/" class="logout-btn">🚪 Logout</a>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" th:text="${totalUsers}">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${totalSellers}">0</div>
                <div class="stat-label">Sellers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${totalCustomers}">0</div>
                <div class="stat-label">Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${totalProducts}">0</div>
                <div class="stat-label">Products</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${totalReviews}">0</div>
                <div class="stat-label">Reviews</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" th:text="${pendingMessages}">0</div>
                <div class="stat-label">Pending Messages</div>
            </div>
        </div>
        
        <div class="section">
            <h3>📋 Recent Users</h3>
            <table>
                <thead>
                    <tr><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${recentUsers}">
                        <td th:text="${user.name}">Name</td>
                        <td th:text="${user.email}">Email</td>
                        <td th:text="${user.userType}">Type</td>
                        <td>
                            <span th:if="${user.active}" style="color:green">Active</span>
                            <span th:unless="${user.active}" style="color:red">Inactive</span>
                        </td>
                        <td>
                            <form action="/admin/user/toggle" method="post" style="display:inline">
                                <input type="hidden" name="userId" th:value="${user.id}">
                                <button type="submit">Toggle</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
