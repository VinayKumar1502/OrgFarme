<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results - OrgFarmer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #666;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🌱 OrgFarmer</div>
        <a href="/logout" style="color: white; text-decoration: none;">Logout</a>
    </div>
    
    <div class="container">
        <a href="/customer/dashboard" class="back-btn">← Back to Dashboard</a>
        <h1>🔍 Search Results for: "<span th:text="${keyword}">keyword</span>"</h1>
        
        <div class="products-grid">
            <div th:each="product : ${products}" class="product-card">
                <h3 th:text="${product.name}">Product Name</h3>
                <p>Price: ₹<span th:text="${product.price}">0</span></p>
                <p>Seller: <span th:text="${product.seller.name}">Seller</span></p>
                <a th:href="@{/customer/product/{id}(id=${product.id})}">View Details →</a>
            </div>
        </div>
        
        <div th:if="${products.empty}">
            <p>No products found matching your search.</p>
        </div>
    </div>
</body>
</html>
