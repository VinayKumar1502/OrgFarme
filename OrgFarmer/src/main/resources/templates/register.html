<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - OrgFarmer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 50px;
            min-height: 100vh;
        }
        .register-container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }
        .login-link a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #1565c0;
        }
        .info-box i {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>📝 Create New Account</h2>
        
        <div class="info-box">
            <i class="fas fa-info-circle"></i> 
            <strong>Note:</strong> Admin accounts can only be created by the system owner. 
            Regular users can register as Customer or Seller.
        </div>
        
        <div th:if="${error}" class="error" th:text="${error}"></div>
        
        <form action="/register" method="post">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" required placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" name="email" required placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" required placeholder="Minimum 6 characters">
            </div>
            
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" name="phone" pattern="[0-9]{10}" required placeholder="10-digit mobile number">
            </div>
            
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" rows="3" placeholder="Your complete address"></textarea>
            </div>
            
            <div class="form-group">
                <label>Register As *</label>
                <select name="userType" required>
                    <option value="CUSTOMER">👤 Customer (Buy products)</option>
                    <option value="SELLER">🌾 Seller/Farmer (Sell products)</option>
                    <!-- ADMIN option REMOVED - Only one admin exists -->
                </select>
            </div>
            
            <div class="form-group">
                <label>Location (Latitude)</label>
                <input type="text" name="latitude" placeholder="e.g., 28.6139">
                <small style="color:#666;">Optional - Helps find nearby sellers</small>
            </div>
            
            <div class="form-group">
                <label>Location (Longitude)</label>
                <input type="text" name="longitude" placeholder="e.g., 77.2090">
            </div>
            
            <button type="submit">🔓 Register Now</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</body>
</html>
